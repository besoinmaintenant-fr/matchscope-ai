<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>MatchScope — Sync Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #050806;
      color: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    h1 {
      color: #00e86b;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #8e9b93;
      margin-bottom: 30px;
    }

    .card {
      background: #0b110d;
      border: 1px solid #1c2a21;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #aeb9b2;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #26362c;
      background: #050806;
      color: white;
      font-size: 16px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #00e86b;
      color: #001b0b;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .status {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #020403;
      border: 1px solid #1c2a21;
      border-radius: 10px;
      padding: 14px;
      min-height: 120px;
      font-size: 12px;
      color: #d6ffdf;
    }

    .success {
      color: #00e86b;
    }

    .error {
      color: #ff6b6b;
    }

    .warning {
      color: #ffd166;
    }

    .small {
      font-size: 12px;
      color: #829087;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>MatchScope Admin</h1>

    <div class="subtitle">
      Synchronisation de l'historique
    </div>


    <div class="card">

      <label for="secret">
        MATCHSCOPE_SYNC_SECRET
      </label>

      <input
        id="secret"
        type="password"
        autocomplete="off"
        placeholder="Entre ton secret Netlify"
      />


      <label for="part">
        Partie du seed
      </label>

      <select id="part">

        <option value="99">
          TEST — part 99
        </option>

        <option value="1">
          Partie 1 / 7
        </option>

        <option value="2">
          Partie 2 / 7
        </option>

        <option value="3">
          Partie 3 / 7
        </option>

        <option value="4">
          Partie 4 / 7
        </option>

        <option value="5">
          Partie 5 / 7
        </option>

        <option value="6">
          Partie 6 / 7
        </option>

        <option value="7">
          Partie 7 / 7
        </option>

      </select>


      <button id="runButton">
        Lancer la synchronisation
      </button>


      <div
        id="status"
        class="status"
      >
      </div>


      <div class="small">
        Le secret est envoyé uniquement à la Function Netlify.
        Il n'est pas enregistré par cette page.
      </div>

    </div>


    <div class="card">

      <strong>
        Réponse serveur
      </strong>

      <pre id="result">
Aucun appel effectué.
      </pre>

    </div>

  </div>


  <script>

    const secretInput =
      document.getElementById(
        'secret'
      );


    const partInput =
      document.getElementById(
        'part'
      );


    const button =
      document.getElementById(
        'runButton'
      );


    const status =
      document.getElementById(
        'status'
      );


    const result =
      document.getElementById(
        'result'
      );


    button.addEventListener(
      'click',
      async () => {

        const secret =
          secretInput
            .value
            .trim();


        const part =
          partInput
            .value;


        if (!secret) {

          status.className =
            'status error';

          status.textContent =
            'Entre ton MATCHSCOPE_SYNC_SECRET.';

          return;
        }


        button.disabled =
          true;


        status.className =
          'status warning';


        status.textContent =
          `Appel de la partie ${part} en cours...`;


        result.textContent =
          'Connexion à Netlify...';


        try {

          const response =
            await fetch(

              `/.netlify/functions/sync-history?mode=seed&part=${encodeURIComponent(
                part
              )}`,

              {

                method:
                  'POST',

                headers: {

                  'X-MatchScope-Secret':
                    secret,

                  'Content-Type':
                    'application/json'
                }
              }
            );


          const text =
            await response.text();


          let data;


          try {

            data =
              JSON.parse(
                text
              );

          } catch {

            data = {
              raw:
                text
            };
          }


          result.textContent =
            JSON.stringify(
              data,
              null,
              2
            );


          if (
            response.ok &&
            data?.success
          ) {

            status.className =
              'status success';


            status.textContent =
              'Synchronisation terminée avec succès.';

          } else {

            status.className =
              'status error';


            status.textContent =
              `Réponse serveur HTTP ${response.status}.`;
          }


        } catch (
          error
        ) {

          status.className =
            'status error';


          status.textContent =
            'Erreur de connexion.';


          result.textContent =
            String(
              error?.message
              ||
              error
            );
        }


        button.disabled =
          false;
      }
    );

  </script>

</body>
</html>
