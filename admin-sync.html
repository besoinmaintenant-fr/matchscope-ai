<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>MatchScope Admin</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 25px;

      background:
        #050806;

      color:
        white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    }


    main {
      max-width:
        650px;

      margin:
        auto;
    }


    h1 {
      color:
        #00e86b;
    }


    .card {
      margin-top:
        25px;

      padding:
        20px;

      border:
        1px solid #203528;

      border-radius:
        16px;

      background:
        #09100c;
    }


    label {
      display:
        block;

      margin-top:
        15px;

      margin-bottom:
        7px;

      color:
        #b0bbb4;
    }


    input,
    select {

      width:
        100%;

      padding:
        15px;

      border:
        1px solid #294033;

      border-radius:
        10px;

      background:
        #020403;

      color:
        white;

      font-size:
        16px;
    }


    button {

      width:
        100%;

      margin-top:
        22px;

      padding:
        17px;

      border:
        0;

      border-radius:
        11px;

      background:
        #00e86b;

      color:
        #00190a;

      font-size:
        17px;

      font-weight:
        800;
    }


    button:disabled {
      opacity:
        0.5;
    }


    #status {
      margin-top:
        20px;

      font-weight:
        700;
    }


    pre {

      min-height:
        150px;

      padding:
        15px;

      white-space:
        pre-wrap;

      overflow-wrap:
        anywhere;

      background:
        black;

      border:
        1px solid #203528;

      border-radius:
        12px;

      color:
        #d7ffe1;
    }


    .ok {
      color:
        #00e86b;
    }


    .error {
      color:
        #ff6b6b;
    }


    .waiting {
      color:
        #ffd166;
    }

  </style>

</head>


<body>

<main>

  <h1>
    MatchScope Admin
  </h1>

  <p>
    Synchronisation historique
  </p>


  <div class="card">

    <label>
      MATCHSCOPE_SYNC_SECRET
    </label>


    <input
      id="secret"
      type="password"
      autocomplete="off"
      placeholder="Secret Netlify"
    >


    <label>
      Partie
    </label>


    <select id="part">

      <option value="99">
        TEST — part 99
      </option>

      <option value="1">
        Partie 1 / 7
      </option>

      <option value="2">
        Partie 2 / 7
      </option>

      <option value="3">
        Partie 3 / 7
      </option>

      <option value="4">
        Partie 4 / 7
      </option>

      <option value="5">
        Partie 5 / 7
      </option>

      <option value="6">
        Partie 6 / 7
      </option>

      <option value="7">
        Partie 7 / 7
      </option>

    </select>


    <button id="run">
      Lancer
    </button>


    <div id="status">
    </div>

  </div>


  <div class="card">

    <strong>
      Réponse serveur
    </strong>


    <pre id="result">
Aucun test lancé.
    </pre>

  </div>

</main>


<script>

const secret =
  document.getElementById(
    'secret'
  );


const part =
  document.getElementById(
    'part'
  );


const button =
  document.getElementById(
    'run'
  );


const status =
  document.getElementById(
    'status'
  );


const result =
  document.getElementById(
    'result'
  );


button.addEventListener(
  'click',

  async () => {

    const secretValue =
      secret
        .value
        .trim();


    if (!secretValue) {

      status.className =
        'error';

      status.textContent =
        'Entre ton secret.';

      return;
    }


    button.disabled =
      true;


    status.className =
      'waiting';


    status.textContent =
      'Connexion en cours...';


    result.textContent =
      'Attente de Netlify...';


    try {

      const response =
        await fetch(
          '/.netlify/functions/sync-history',
          {
            method:
              'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify({
                secret:
                  secretValue,

                mode:
                  'seed',

                part:
                  Number(
                    part.value
                  )
              })
          }
        );


      const text =
        await response.text();


      let data;


      try {

        data =
          JSON.parse(text);

      } catch {

        data = {
          raw:
            text
        };
      }


      result.textContent =
        JSON.stringify(
          data,
          null,
          2
        );


      if (
        data?.success
      ) {

        status.className =
          'ok';

        status.textContent =
          'Synchronisation réussie.';

      } else {

        status.className =
          'error';

        status.textContent =
          `Réponse HTTP ${response.status}.`;
      }


    } catch (error) {

      status.className =
        'error';


      status.textContent =
        'Erreur réseau.';


      result.textContent =
        String(
          error?.message
          ||
          error
        );
    }


    button.disabled =
      false;
  }
);

</script>

</body>
</html>
