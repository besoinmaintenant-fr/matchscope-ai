[build]
  publish = "."
  functions = "netlify/functions"


[functions]
  node_bundler = "esbuild"


# =====================================================
# MATCHSCOPE — AUTOMATISATIONS
# =====================================================


# -----------------------------------------------------
# SNAPSHOTS PRÉ-MATCH
#
# Toutes les 30 minutes entre 08h00 et 22h30 UTC.
#
# Capture automatiquement :
# - D1
# - H6
# - H3
# - H90
#
# La plupart des passages sont légers :
# la fiche détaillée Sportmonks n'est appelée
# que lorsqu'un snapshot est réellement dû.
# -----------------------------------------------------

[functions."collect-prematch-snapshots"]
  schedule = "*/30 8-22 * * *"


# -----------------------------------------------------
# COMPOSITIONS OFFICIELLES + SNAPSHOT FINAL
#
# Toutes les 10 minutes, en continu (heures de match internationales).
#
# Dès que les 22 titulaires sont disponibles :
# - XI enregistrés
# - match enregistré
# - snapshot FINAL enregistré
# - calcul 1/N/2 figé avant le coup d'envoi si modèle calibré
# -----------------------------------------------------

[functions."collect-lineups"]
  schedule = "*/10 * * * *"


# -----------------------------------------------------
# FIN DES MATCHS
#
# - score final
# - résultat 1/N/2
# - Brier Scores
# -----------------------------------------------------

[functions."postmatch-auto"]
  schedule = "*/15 12-23 * * *"


# -----------------------------------------------------
# ENRICHISSEMENT HISTORIQUE
# -----------------------------------------------------

[functions."trigger-enrichment"]
  schedule = "20 */3 * * *"


# =====================================================
# HEADERS
# =====================================================

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
